# Dependabot keeps pinned dependencies up to date by opening pull requests.
# Every update still goes through CI and a manual merge.
version: 2
updates:
  # GitHub Actions used in .github/workflows (pinned to commit SHAs).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Python tools installed by CI (workflow linters), pinned in
  # .github/requirements-ci.txt.
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      ci-tools:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # JUCE is fetched by CMake (FetchContent) at a pinned tag, which Dependabot
  # cannot track. JUCE updates are done by hand: see docs/ARCHITECTURE.md.
